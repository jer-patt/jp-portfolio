<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jermaine Patterson — Contact</title>
<style>
@font-face { font-family: 'Unageo'; src: url('assets/fonts/Unageo-Regular.ttf') format('truetype'); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: 'Unageo'; src: url('assets/fonts/Unageo-Bold.ttf') format('truetype'); font-weight: 700; font-style: normal; font-display: swap; }
body { margin: 0; font-family: 'Unageo', system-ui, sans-serif; background: #000000; }
a { color: inherit; text-decoration: none; }
.nav-link:hover { opacity: 0.6; }
.disp { font-family: 'Unageo', sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: -0.01em; }
.tile { position: relative; overflow: hidden; }
.tile:hover .tile-title { color: #D4AF37; }
.tile:hover .tile-img { transform: scale(1.03); }
.tile-img { transition: transform 0.4s ease; }
.field-input { width: 100%; box-sizing: border-box; background: transparent; border: none; border-bottom: 1px solid rgba(245,243,239,0.3); color: #F5F3EF; font-family: 'Unageo', sans-serif; font-size: 15px; padding: 10px 2px; outline: none; }
.field-input::placeholder { color: #6B6758; }
.field-input:focus { border-bottom-color: #D4AF37; }
.field-label { display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #9C988A; margin-bottom: 8px; }
.submit-btn { font-family: 'Unageo', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; background: #D4AF37; color: #000000; border: none; padding: 16px 36px; cursor: pointer; transition: opacity 0.2s ease; }
.submit-btn:hover { opacity: 0.85; }
</style>
</head>
<body>
<div style="width: 100%; box-sizing: border-box; background: #000000; color: #F5F3EF;">

  <!-- NAV -->
  <div style="width: 100%; box-sizing: border-box; padding: 22px 48px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(245,243,239,0.12); position: sticky; top: 0; background: #000000; z-index: 10;">
    <a href="index.html" style="font-size: 16px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase;">Jermaine Patterson</a>
    <div style="display: flex; gap: 32px; align-items: center;">
      <a class="nav-link" href="index.html#work" style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;">Work</a>
      <a class="nav-link" href="video.html" style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;">Video</a>
      <a class="nav-link" href="https://youtu.be/BjSy7h24Czc" target="_blank" rel="noopener" style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #D4AF37;">Reel</a>
      <a class="nav-link" href="contact.html" style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #D4AF37;">Contact</a>
    </div>
  </div>

  <!-- HERO -->
  <div style="width: 100%; box-sizing: border-box; padding: 72px 48px 16px;">
    <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #D4AF37; margin-bottom: 18px;">Get In Touch</div>
    <h1 class="disp" style="margin: 0; font-size: 72px; line-height: 0.98; color: #F5F3EF;">Let's work together.</h1>
  </div>

  <!-- CONTACT GRID -->
  <div style="width: 100%; box-sizing: border-box; padding: 56px 48px 80px; display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); gap: 80px;">

    <!-- INFO -->
    <div style="display: flex; flex-direction: column; gap: 28px;">
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #6B6758;">Email</div>
        <a href="mailto:jermaine.e.patterson@gmail.com" style="font-size: 16px; font-weight: 700; color: #D4AF37;">jermaine.e.patterson@gmail.com</a>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #6B6758;">Location</div>
        <div style="font-size: 16px; font-weight: 700; color: #F5F3EF;">Baton Rouge, LA</div>
      </div>
    </div>

    <!-- FORM -->
    <form action="mailto:jermaine.e.patterson@gmail.com?subject=New%20Contact%20Form%20Submission" method="post" enctype="text/plain" style="display: flex; flex-direction: column; gap: 28px;">
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px;">
        <div>
          <label class="field-label" for="firstName">First Name</label>
          <input class="field-input" type="text" id="firstName" name="First Name" required>
        </div>
        <div>
          <label class="field-label" for="lastName">Last Name</label>
          <input class="field-input" type="text" id="lastName" name="Last Name">
        </div>
      </div>
      <div>
        <label class="field-label" for="email">Email</label>
        <input class="field-input" type="email" id="email" name="Email" required>
      </div>
      <div>
        <label class="field-label" for="message">Message</label>
        <textarea class="field-input" id="message" name="Message" rows="4" required style="resize: vertical; font-family: 'Unageo', sans-serif;"></textarea>
      </div>
      <div>
        <button class="submit-btn" type="submit">Submit</button>
      </div>
    </form>
  </div>

  <!-- FOOTER -->
  <div style="width: 100%; box-sizing: border-box; padding: 60px 48px 40px; margin-top: 40px; border-top: 1px solid rgba(245,243,239,0.12); display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center;">
    <a href="mailto:jermaine.e.patterson@gmail.com" style="font-size: 13px; font-weight: 700; color: #D4AF37; letter-spacing: 0.04em;">jermaine.e.patterson@gmail.com</a>
    <div style="font-size: 12px; color: #6B6758; font-weight: 600;">&copy; 2026 Jermaine Patterson Jr.</div>
  </div>

</div>
</body>
</html>
